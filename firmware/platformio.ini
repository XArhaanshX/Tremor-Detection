; Tremor band firmware. Default target: Seeed XIAO ESP32-S3 (the wristband).
;   pio run -e xiao_esp32s3 -t upload        real MPU-6050
;   pio run -e xiao_esp32s3_sim -t upload    simulated patient, no sensor needed
;   pio run -e esp32dev                      classic ESP32 dev board (bench prototype)

[platformio]
default_envs = xiao_esp32s3

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
build_flags = -O2 -Wall
board_build.filesystem = littlefs

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
board_build.partitions = default_8MB.csv
build_flags = ${env.build_flags} -DBOARD_XIAO_ESP32S3

[env:xiao_esp32s3_sim]
extends = env:xiao_esp32s3
build_flags = ${env:xiao_esp32s3.build_flags} -DSIMULATE_IMU

[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags}

[env:esp32dev_sim]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSIMULATE_IMU

; Wiring diagnostic (not the band firmware): pio run -e i2c_scan -t upload
[env:i2c_scan]
board = esp32dev
lib_deps =
build_src_filter = -<*> +<../diag/i2c_scan.cpp>
